<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standup Voice</title>
<style>
  :root {
    --bg: #0b1020; --panel: #141a2e; --line: #232b45; --text: #e8ecf8; --muted: #8b94b3;
    --ring: #1fb6ff; --ring-2: #6a5cff; --you: #1f2a48; --ok: #3ddc97; --warn: #ffb547;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
  header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  .badge { font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 2px 8px; border-radius: 99px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; min-width: 0; }
  .stage { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 18px; padding: 32px 0; }
  .stage > * { max-width: 100%; }
  .chips, form { width: 100%; }
  #mic { width: 148px; height: 148px; border-radius: 50%; border: 0; cursor: pointer; background: radial-gradient(circle at 50% 45%, #1a2442, #0e1428 70%); box-shadow: 0 0 0 6px var(--ring), 0 0 40px rgba(31,182,255,.35); transition: box-shadow .2s, transform .1s; color: var(--text); font-size: 15px; }
  #mic:active { transform: scale(.97); }
  #mic.listening { animation: pulse 1.1s ease-in-out infinite; }
  #mic.thinking { box-shadow: 0 0 0 6px var(--ring-2), 0 0 40px rgba(106,92,255,.45); animation: spin 1.2s linear infinite; }
  #mic.speaking { box-shadow: 0 0 0 10px var(--ring), 0 0 60px rgba(31,182,255,.55); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 14px var(--ring), 0 0 70px rgba(31,182,255,.6); } }
  @keyframes spin { 50% { box-shadow: 0 0 0 6px var(--ring), 0 0 30px rgba(31,182,255,.3); } }
  .hint { color: var(--muted); font-size: 14px; text-align: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--ring); }
  form { display: flex; gap: 8px; width: 100%; max-width: 560px; }
  input { flex: 1; min-width: 0; background: #0e1428; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
  button.send { background: var(--ring); color: #04121c; border: 0; border-radius: 10px; padding: 0 16px; font-weight: 600; cursor: pointer; }
  #log { display: grid; gap: 10px; margin-top: 8px; }
  .msg { padding: 10px 14px; border-radius: 12px; line-height: 1.45; max-width: 90%; overflow-wrap: anywhere; }
  .you { background: var(--you); justify-self: end; }
  .alexa { background: #0e1428; border: 1px solid var(--line); }
  .trace { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); margin-top: 6px; white-space: pre-wrap; }
  .trace b { color: var(--ring); font-weight: 600; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
  #card h3 { font-size: 13px; margin: 14px 0 6px; color: var(--ring); }
  #card ul { margin: 0; padding-left: 18px; }
  #card li { margin: 4px 0; line-height: 1.4; overflow-wrap: anywhere; }
  #card a { color: var(--muted); }
  #card .empty { color: var(--muted); font-size: 14px; }
  .err { color: var(--warn); }
  @media (max-width: 420px) { .panel { padding: 14px; } #mic { width: 124px; height: 124px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Standup Voice</h1>
    <span class="badge">Simulated Alexa+ · MCP over Streamable HTTP</span>
    <span class="badge" id="agent">agent: …</span>
  </header>

  <section class="panel">
    <div class="stage">
      <button id="mic" aria-label="Talk">Tap to talk</button>
      <div class="hint" id="hint">Try “Alexa, what's my standup?”</div>
      <div class="chips">
        <button class="chip">What's my standup?</button>
        <button class="chip">I need to fix the login redirect bug in slender</button>
        <button class="chip">I'm blocked on the Google OAuth client secret</button>
        <button class="chip">Anything blocking me?</button>
      </div>
      <form id="form"><input id="text" placeholder="Or type what you'd say…" autocomplete="off"><button class="send">Send</button></form>
    </div>
    <div id="log" aria-live="polite"></div>
  </section>

  <aside class="panel">
    <h2>Today's standup</h2>
    <div id="card"><p class="empty">Ask for your standup to see it here.</p></div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const mic = $("mic"), log = $("log");
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

// Tiny renderer for the standup markdown the server returns.
function renderCard(md) {
  const html = [];
  let inList = false;
  for (const line of md.split("\n")) {
    if (line.startsWith("## ")) { if (inList) html.push("</ul>"); inList = false; html.push(`<h3>${esc(line.slice(3))}</h3>`); }
    else if (line.startsWith("- ")) {
      if (!inList) { html.push("<ul>"); inList = true; }
      let item = esc(line.slice(2)).replace(/_\((.*?)\)_/g, "<em>($1)</em>").replace(/\[issue\]\((https?:[^)]+)\)/g, '<a href="$1" target="_blank" rel="noopener">link</a>');
      html.push(`<li>${item}</li>`);
    }
  }
  if (inList) html.push("</ul>");
  $("card").innerHTML = html.join("") || '<p class="empty">Nothing yet.</p>';
}

function add(cls, text, trace) {
  const div = document.createElement("div");
  div.className = `msg ${cls}`;
  div.textContent = text;
  if (trace && trace.length) {
    const t = document.createElement("div");
    t.className = "trace";
    t.innerHTML = trace.map((c) => `<b>MCP → ${esc(c.name)}</b>(${esc(JSON.stringify(c.args))})`).join("\n");
    div.appendChild(t);
  }
  log.prepend(div);
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.05;
  u.onstart = () => mic.className = "speaking";
  u.onend = () => mic.className = "";
  speechSynthesis.speak(u);
}

async function ask(utterance) {
  utterance = utterance.replace(/^(hey |ok )?alexa[,\s]*/i, "").trim();
  if (!utterance) return;
  add("you", utterance);
  mic.className = "thinking";
  try {
    const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ utterance }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    $("agent").textContent = `agent: ${data.agent}`;
    add("alexa", data.speech, data.trace);
    if (data.card) renderCard(data.card);
    speak(data.speech);
    if (!("speechSynthesis" in window)) mic.className = "";
  } catch (err) {
    mic.className = "";
    add("alexa err", `Something went wrong: ${err.message}`);
  }
}

let rec = null;
if (SR) {
  rec = new SR();
  rec.lang = "en-US";
  rec.interimResults = false;
  rec.onresult = (e) => ask(e.results[0][0].transcript);
  rec.onend = () => { if (mic.className === "listening") mic.className = ""; };
  rec.onerror = (e) => { mic.className = ""; $("hint").textContent = `Mic error: ${e.error}. You can type instead.`; };
} else {
  $("hint").textContent = "Voice input isn't supported in this browser. Type below; replies are still spoken.";
}

mic.onclick = () => {
  if (!rec) { $("text").focus(); return; }
  speechSynthesis.cancel();
  mic.className = "listening";
  rec.start();
};
document.querySelectorAll(".chip").forEach((c) => c.onclick = () => ask(c.textContent));
$("form").onsubmit = (e) => { e.preventDefault(); const v = $("text").value; $("text").value = ""; ask(v); };
</script>
</body>
</html>
